name: Update PCR Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch nickname source
        run: |
          NICKNAME_SHA=$(git ls-remote https://github.com/cc004/autopcr.git refs/heads/main | awk '{print $1}')
          curl -fsSL "https://raw.githubusercontent.com/cc004/autopcr/${NICKNAME_SHA}/autopcr/util/pcr_data.py" -o _pcr_data.py
          echo "NICKNAME_REVISION=${NICKNAME_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Run download_db
        run: python download_db.py

      - name: Build JJC pack
        run: python build_jjc_pack.py --nickname _pcr_data.py --nickname-revision "$NICKNAME_REVISION"

      - name: Upload JJC pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: jjc-pack
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish latest JJC pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACK="dist/jjc-pack-latest.zip"
          NOTES="dist/release-notes.md"

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          pack = Path("dist/jjc-pack-latest.zip")
          with zipfile.ZipFile(pack) as zf:
              manifest = json.loads(zf.read("manifest.json").decode("utf-8"))

          counts = manifest["counts"]
          sources = manifest["sources"]
          notes = f"""Automated JJC data pack release.

          - Pack version: `{manifest["pack_version"]}`
          - Generated at: `{manifest["generated_at"]}`
          - Units: `{counts["units"]}`
          - Aliases: `{counts["aliases"]}`
          - Alias conflicts: `{counts["alias_conflicts"]}`
          - CN DB: `{sources["cn"]["truth_version"]}` / `{sources["cn"]["db_hash"]}`
          - JP DB: `{sources["jp"]["truth_version"]}` / `{sources["jp"]["db_hash"]}`
          - Nickname source: `{sources["nickname"]["revision"]}`
          """
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY

          git tag -f jjc-pack-latest "$GITHUB_SHA"
          git push --force origin refs/tags/jjc-pack-latest

          if gh release view jjc-pack-latest >/dev/null 2>&1; then
            gh release upload jjc-pack-latest "$PACK" --clobber
            gh release edit jjc-pack-latest --title "JJC Data Pack Latest" --notes-file "$NOTES" --latest --target "$GITHUB_SHA"
          else
            gh release create jjc-pack-latest "$PACK" --title "JJC Data Pack Latest" --notes-file "$NOTES" --latest --target "$GITHUB_SHA"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CN_pcr_data.py JP_pcr_data.py TW_pcr_data.py
          git diff --cached --quiet || git commit -m "auto: update pcr data $(date +%Y-%m-%d)"
          git push
